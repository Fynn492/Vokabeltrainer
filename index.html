<style>
/* Simple, warm: beige page, white cards, one terracotta accent. */
:root {

}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 400 16px/1.5 var(--f); padding: 20px 16px 40px; }
.wrap { max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, p { margin: 0; }
h1 { font-size: 28px; line-height: 1.15; font-weight: 700; letter-spacing: -0.02em; }
.sub { color: var(--muted); font-size: 15px; }
.box { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
.label { font-size: 15px; font-weight: 600; }
.counts { display: flex; gap: 32px; }
.count b { display: block; font-size: 40px; line-height: 1; font-weight: 700; font-variant-numeric: tabular-nums; }
.count span { font-size: 14px; color: var(--muted); }
.btn { background: var(--accent); color: #fff; border: 0; border-radius: 12px; padding: 14px; font-weight: 600; font-size: 17px; width: 100%; }
.btn[disabled] { background: var(--soft); color: var(--muted); cursor: default; }
.note { color: var(--muted); font-size: 14px; }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; background: var(--soft); padding: 4px; border-radius: 12px; }
.seg button { border: 0; background: transparent; border-radius: 9px; padding: 10px 4px; font-size: 15px; }
.seg button[aria-checked="true"] { background: var(--card); font-weight: 600; box-shadow: 0 1px 3px rgba(60,40,20,.15); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 6px 13px; font-size: 14px; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--card); border-color: var(--ink); }
.row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.stepper { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 10px; }
.stepper button { border: 0; background: transparent; width: 40px; height: 38px; font-size: 20px; line-height: 1; }
.stepper output { min-width: 32px; text-align: center; font-variant-numeric: tabular-nums; }
.foot { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; font-size: 14px; color: var(--muted); }
.link { background: none; border: 0; padding: 0; color: var(--muted); text-decoration: underline; text-underline-offset: 3px; font-size: 14px; }
.danger { color: var(--bad); }
.bar { display: flex; align-items: center; gap: 12px; }
.prog { flex: 1; height: 6px; background: var(--soft); border-radius: 99px; overflow: hidden; }
.prog i { display: block; height: 100%; background: var(--accent); transition: width .25s; }
.left { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
.card { min-height: 300px; justify-content: center; text-align: center; cursor: pointer; }
.card.open { cursor: default; }
.lang { font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
.word { font-size: clamp(28px, 8vw, 38px); line-height: 1.2; font-weight: 600; overflow-wrap: anywhere; }
.answer { font-size: clamp(24px, 6.5vw, 30px); line-height: 1.25; font-weight: 600; color: var(--accent); border-top: 1px solid var(--line); padding-top: 14px; overflow-wrap: anywhere; }
.tag { display: inline-block; font-size: 12px; color: var(--muted); border: 1px solid var(--line); border-radius: 6px; padding: 1px 8px; }
.grades { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.grade { border-radius: 12px; padding: 14px; font-weight: 600; font-size: 16px; border: 2px solid; }
.grade.again { background: var(--card); border-color: var(--bad); color: var(--bad); }
.grade.good { background: var(--ok); border-color: var(--ok); color: #fff; }
</style>

    h += '<button class="btn-main" data-act="start"' + (done ? ' disabled' : '') + '>' + (done ? 'Heute erledigt' : 'Los geht’s') + '</button>';
    h += '<p class="note">' + esc(msg) + '</p></div></section>';

    h += '<section class="panel"><h2>Fortschritt</h2><div class="stats">';
    h += '<div class="stat"><b>' + state.streak.count + '</b><span>Tage in Folge</span></div>';
    h += '<div class="stat"><b>' + keys.length + '</b><span>Karten gesehen</span></div>';
    h += '<div class="stat"><b>' + box[5] + '</b><span>im letzten Fach</span></div></div>';
    h += '<div class="boxes" role="img" aria-label="Karten pro Fach: ' + [1, 2, 3, 4, 5].map(function (i) { return 'Fach ' + i + ': ' + box[i]; }).join(', ') + '">';
    for (var i = 1; i <= 5; i++) {
      h += '<div class="box"><span class="n">' + box[i] + '</span><div class="bar"><i style="height:' + Math.round(box[i] / max * 100) + '%"></i></div>';
      h += '<span class="l"><b>Fach ' + i + '</b>' + INTERVAL_LABEL[i] + '</span></div>';
    }
    h += '</div></section>';

    h += '<section class="panel"><h2>Einstellungen</h2>';
    h += '<div class="field"><span>Abfragerichtung</span><div class="seg" role="radiogroup" aria-label="Abfragerichtung">';
    [["fd", "FR → DE"], ["df", "DE → FR"], ["both", "Beides"]].forEach(function (o) {
      h += '<button role="radio" aria-checked="' + (m === o[0]) + '" data-act="mode" data-v="' + o[0] + '">' + o[1] + '</button>';
    });
    h += '</div></div>';
    h += '<div class="row"><span>Neue Karten pro Tag</span><div class="stepper"><button data-act="perday" data-v="-1" aria-label="Weniger">−</button><output aria-live="polite">' + state.settings.perDay + '</output><button data-act="perday" data-v="1" aria-label="Mehr">+</button></div></div>';
    h += '<div class="field"><span>Themen</span><div class="chips">';
    CATS.forEach(function (ct) {
      var on = state.settings.cats.indexOf(ct[0]) >= 0;
      h += '<button class="chip" aria-pressed="' + on + '" data-act="cat" data-v="' + ct[0] + '">' + esc(ct[1]) + '</button>';
    });
    h += '</div></div>';
    if (m === "both") h += '<p class="note">Bei „Beides“ kommt die Rückrichtung DE → FR, sobald du eine Karte sicher kannst (ab Fach 3).</p>';
    h += '</section>';

    h += '<footer class="panel" style="gap:10px">';
    var sy = { cloud: "Fortschritt gespeichert und auf allen Geräten verfügbar.", local: "Fortschritt nur in diesem Browser gespeichert.", error: "Speichern im Konto gerade nicht möglich. Der Stand bleibt in diesem Browser." }[ui.sync];
    h += '<p class="sync">' + sy + '</p>';
    if (ui.confirmReset) {
      h += '<div class="row"><span class="danger">Gesamten Fortschritt löschen?</span><span style="display:flex;gap:16px"><button class="link danger" data-act="reset-yes">Ja, löschen</button><button class="link" data-act="reset-no">Abbrechen</button></span></div>';
    } else {
      h += '<div><button class="link" data-act="reset">Fortschritt zurücksetzen</button></div>';
    }
    h += '</footer>';
    return h;
  }

  function sessionHTML() {
    var key = session.queue[0];
    if (true) {
      var idx0 = +key.slice(1, -1), fr = key.slice(-1) === "f", cd = DECK[idx0];
      var qq = fr ? cd[1] : cd[2], aa = fr ? cd[2] : cd[1];
      var p0 = Math.round(session.solved / session.total * 100);
      var s = '<div class="bar"><button class="link" data-act="quit">Beenden</button><div class="prog" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="' + p0 + '"><i style="width:' + p0 + '%"></i></div><span class="left">noch ' + session.queue.length + '</span></div>';
      s += '<div class="box card' + (session.revealed ? ' open' : '') + '"' + (session.revealed ? '' : ' role="button" tabindex="0" data-act="flip" aria-label="Antwort anzeigen"') + '>';
      s += '<span class="lang">' + (fr ? 'Französisch' : 'Deutsch') + '</span>';
      s += '<p class="word" lang="' + (fr ? 'fr' : 'de') + '">' + esc(qq) + '</p>';
      if (session.revealed) {
        s += '<p class="answer" aria-live="polite" lang="' + (fr ? 'de' : 'fr') + '">' + esc(aa) + '</p>';
        if (cd[3]) s += '<span><span class="tag">' + (cd[3] === 'fam.' ? 'umgangssprachlich' : 'unregelmäßiges Verb') + '</span></span>';
      } else {
        s += '<p class="note">Antippen für die Lösung</p>';
      }
      s += '</div>';
      if (session.revealed) s += '<div class="grades"><button class="grade again" data-act="grade" data-v="0">Nochmal</button><button class="grade good" data-act="grade" data-v="1">Gewusst</button></div>';
      return s;
    }
    var idx = +key.slice(1, -1), dir = key.slice(-1);
    var card = DECK[idx];
    var q = dir === "f" ? card[1] : card[2];
    var a = dir === "f" ? card[2] : card[1];
    var pct = Math.round(session.solved / session.total * 100);
    var it = state.items[key];
    var h = '<div class="sessionbar"><button class="link" data-act="quit">Beenden</button>';
    h += '<div class="prog" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="' + pct + '"><i style="width:' + pct + '%"></i></div>';
    h += '<span class="count-s">noch ' + session.queue.length + '</span></div>';
    h += '<div class="sheet card' + (session.revealed ? ' done' : '') + '"' + (session.revealed ? '' : ' role="button" tabindex="0" data-act="flip" aria-label="Antwort anzeigen"') + '>';
    h += '<div class="card-in" id="card-in"><div class="meta"><span>' + (dir === "f" ? "Französisch" : "Deutsch") + '</span><span>·</span><span>' + esc(CATNAME[card[0]]) + '</span>';
    if (card[3] && dir === "f") h += '<span class="tag">' + esc(card[3]) + '</span>';
    if (!it) h += '<span class="tag">neu</span>';
    h += '</div><p class="word"' + (dir === "f" ? ' lang="fr"' : ' lang="de"') + '>' + esc(q) + '</p>';
    if (session.revealed) {
      h += '<p class="answer" aria-live="polite"' + (dir === "f" ? ' lang="de"' : ' lang="fr"') + '>' + esc(a);
      h += '</p>';
      if (card[3] && dir === "d") h += '<div class="meta"><span class="tag">' + esc(card[3]) + '</span><span>' + (card[3] === "fam." ? "umgangssprachlich" : "unregelmäßiges Verb") + '</span></div>';
    } else {
      h += '<p class="hint">Antippen oder Leertaste zeigt die Antwort.</p>';
    }
    h += '</div></div>';
    if (session.revealed) {
      var b = it ? it.b : 1;
      var nGood = Math.min(5, b + 1), nEasy = Math.min(5, b + 2);
      h += '<div class="grades">';
      h += '<button class="grade again" data-act="grade" data-v="0">Nochmal<small>1 · gleich</small></button>';
      h += '<button class="grade good" data-act="grade" data-v="1">Gewusst<small>2 · ' + INTERVAL_LABEL[nGood] + '</small></button>';
      h += '<button class="grade easy" data-act="grade" data-v="2">Leicht<small>3 · ' + INTERVAL_LABEL[nEasy] + '</small></button>';
      h += '</div>';
    }
    return h;
  }

  function doneHTML() {
    if (true) {
      var t0 = session.right + session.wrong, pc = t0 ? Math.round(session.right / t0 * 100) : 0;
      var d = '<header><h1>Geschafft !</h1><p class="sub">Bien joué, à demain.</p></header>';
      d += '<section class="box"><div class="counts"><div class="count"><b>' + session.solved + '</b><span>Karten</span></div><div class="count"><b>' + pc + '%</b><span>auf Anhieb</span></div></div>';
      d += '<button class="btn" data-act="home">Zur Übersicht</button></section>';
      return d;
    }
    var nd = nextDue();
    var tot = session.right + session.wrong;
    var pct = tot ? Math.round(session.right / tot * 100) : 0;
    var h = '<header><h1>Runde geschafft</h1><p class="sub">Gut gemacht, bis morgen.</p></header>';
    h += '<section class="sheet"><div class="pad" style="display:flex;flex-direction:column;gap:16px"><h2>Diese Runde</h2><div class="summary-nums">';
    h += '<div class="count"><b>' + session.solved + '</b><span>Karten gelöst</span></div>';
    h += '<div class="count"><b>' + pct + '%</b><span>auf Anhieb</span></div>';
    h += '<div class="count"><b>' + state.streak.count + '</b><span>Tage in Folge</span></div></div>';
    h += '<p class="note">' + (nd ? 'Die nächsten Karten sind in ' + plural(nd, 'Tag', 'Tagen') + ' fällig.' : 'Für heute ist nichts mehr fällig.') + '</p>';
    h += '<button class="btn-main" data-act="home">Zur Übersicht</button></div></section>';
    return h;
  }

  var app = document.getElementById("app");
  function render() {
    app.innerHTML = ui.view === "session" && session && session.queue.length ? sessionHTML()
      : ui.view === "done" && session ? doneHTML() : homeHTML();
    if (ui.view !== "session" && ui.view !== "done") ui.view = "home";
  }

  /* ---------- Eingaben ---------- */
  app.addEventListener("click", function (e) {
    var el = e.target.closest("[data-act]");
    if (!el) return;
    var act = el.getAttribute("data-act"), v = el.getAttribute("data-v");
    if (act === "start") startSession();
    else if (act === "more") { state.daily.bonus = (state.daily.bonus || 0) + state.settings.perDay; persist(); startSession(); }
    else if (act === "practice") practice();
    else if (act === "flip") { if (session && !session.revealed) { session.revealed = true; render(); } }
    else if (act === "grade") grade(+v);
    else if (act === "quit") { ui.view = "home"; session = null; render(); }
    else if (act === "home") { ui.view = "home"; session = null; render(); }
    else if (act === "mode") { state.settings.mode = v; persist(); render(); }
    else if (act === "perday") {
      state.settings.perDay = Math.max(5, Math.min(25, state.settings.perDay + (+v))); persist(); render();
    } else if (act === "cat") {
      var cs = state.settings.cats, i = cs.indexOf(v);
      if (i >= 0) { if (cs.length > 1) cs.splice(i, 1); } else cs.push(v);
      persist(); render();
    } else if (act === "reset") { ui.confirmReset = true; render(); }
    else if (act === "reset-no") { ui.confirmReset = false; render(); }
    else if (act === "reset-yes") {
      var keepSettings = state.settings;
      state = fresh(); state.settings = keepSettings;
      ui.confirmReset = false; persist(); render();
    }
  });
  document.addEventListener("keydown", function (e) {
    if (ui.view !== "session" || !session || e.metaKey || e.ctrlKey || e.altKey) return;
    var onButton = e.target && e.target.tagName === "BUTTON";
    if (!session.revealed && (e.key === " " || e.key === "Enter")) {
      if (onButton) return;
      e.preventDefault(); session.revealed = true; render();
    } else if (session.revealed && "123".indexOf(e.key) >= 0 && e.key.length === 1) {
      e.preventDefault(); grade(+e.key - 1);
    }
  });

  render();

  /* ---------- Konto-Speicher (db), falls verfügbar ---------- */
  (async function () {
    try {
      if (!window.claude || !window.claude.use) return;
      var db = await window.claude.use("db");
      var user = await window.claude.use("user");
      if (!db || !user) return;
      var id = await user.id();
      if (!id) return;
      ref = db.doc("data/users/" + id + "/progress");
      var snap = await ref.get();
      if (snap.exists) {
        var remote = normalize(JSON.parse(JSON.stringify(snap.data())));
        if (remote.updated > state.updated) {
          state = remote;
          try { localStorage.setItem(LS, JSON.stringify(state)); } catch (e) {}
        } else if (remote.updated < state.updated) {
          flush();
        }
      } else if (state.updated > 0) {
        flush();
      }
      ui.sync = "cloud";
      if (ui.view === "home") render();
    } catch (e) {
      ref = null; ui.sync = "local";
      if (ui.view === "home") render();
    }
  })();
})();
</script>

</body></html>
